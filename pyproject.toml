[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-fatigue"
version = "0.1.0"
description = "Fatigue Index (FI): a runtime diagnostic for cognitive fatigue in autoregressive transformers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Riju Marwah", email = "marwah.riju@gmail.com" },
]
keywords = ["llm", "transformers", "monitoring", "reliability", "attention", "entropy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
]

[project.optional-dependencies]
# Needed to actually drive HF models end-to-end (fatigue.monitor,
# experiments/rq2.py) rather than just computing FI from precomputed signals.
experiments = [
    "transformers>=4.40",
    "datasets>=2.18",
    "accelerate>=0.30",
    "bitsandbytes>=0.43; platform_system == 'Linux'",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "scipy>=1.10",
    "seaborn>=0.13",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
]
dev = [
    "pytest>=7.4",
]

[project.urls]
Homepage = "https://rijumarwah.github.io/llmfatigue/"
Repository = "https://github.com/rijumarwah/cognitive-fatigue-llms"

[tool.setuptools.packages.find]
include = ["fatigue*"]
